<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Team Tracker - Authenticate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-left">
                <h2 style="color:var(--primary-color);">Team Availability Tracker</h2>
                <p style="color:var(--text-muted); font-size:14px; text-align:center; margin-top:12px;">
                    Monitor available vs busy human resources instantly from a single secure control panel.
                </p>
            </div>
            <div class="auth-right">
                <h3 style="font-size:24px; margin-bottom:6px;">Welcome Back</h3>
                <p style="color:var(--text-muted); font-size:14px; margin-bottom:24px;">Login to access your dashboard</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" value="admin@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" value="password123" required>
                    </div>
                    <div class="remember-forgot">
                        <label><input type="checkbox" checked> Remember me</label>
                        <a href="#" style="color:var(--primary-color); text-decoration:none;">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn-primary">Login</button>
                </form>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            if (res.ok) window.location.href = '/dashboard';
            else alert("Invalid login credentials!");
        });
    </script>
</body>
</html>
